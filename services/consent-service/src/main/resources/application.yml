server:
  port: 8082

spring:
  application:
    name: consent-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/consent_db
  kafka:
    bootstrap-servers: localhost:9094
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8180/realms/openfinance/protocol/openid-connect/certs

management:
  endpoints:
    web:
      exposure:
        include: health,info
