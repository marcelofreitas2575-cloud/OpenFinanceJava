spring:
  data:
    mongodb:
      uri: mongodb://mongodb:27017/account_db
    redis:
      host: redis
      port: 6379
  kafka:
    bootstrap-servers: kafka:9092
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://keycloak:8080/realms/openfinance/protocol/openid-connect/certs

integration:
  mock-institution:
    base-url: http://mock-institution-service:8090
