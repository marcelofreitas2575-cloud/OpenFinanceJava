server:
  port: 8083

spring:
  application:
    name: account-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/account_db
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9094
    consumer:
      group-id: account-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: br.com.openfinance.events
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8180/realms/openfinance/protocol/openid-connect/certs

integration:
  mock-institution:
    base-url: http://localhost:8090
    api-key: mock-bank-secret-key

management:
  endpoints:
    web:
      exposure:
        include: health,info
